<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</head>
<body>
    <h1>Bootstrap 5 Button Groups</h1>
    <h2>Button Groups</h2>
    <h3>Bootstrap 5 allows you to group a series of buttons together (on a single line) in a button group:</h3>
    <div class="btn-group">
        <button type="button" class="btn btn-danger">apple</button>
        <button type="button" class="btn btn-danger">banana</button>
        <button type="button" class="btn btn-danger">kiwi</button>
    </div>
    <h2>sizes of button</h2>
    <div class="btn-group btn-group-lg">
        <button type="button" class="btn btn-secondary">apple</button>
        <button type="button" class="btn btn-secondary">banana</button>
        <button type="button" class="btn btn-secondary">kiwi</button>
    </div>
    <div class="btn-group btn-group-sm">
        <button type="button" class="btn btn-danger">apple</button>
        <button type="button" class="btn btn-danger">banana</button>
        <button type="button" class="btn btn-danger">kiwi</button>
    </div>
    <div class="btn-group btn-group-md">
        <button type="button" class="btn btn-primary">apple</button>
        <button type="button" class="btn btn-primary">banana</button>
        <button type="button" class="btn btn-primary">kiwi</button>
    </div>
    <div class="container">
    <h1>Vertical Button Groups</h1>
    <div class="btn-group-vertical">
        <button type="button" class="btn btn-primary">apple</button>
        <button type="button" class="btn btn-primary">banana</button>
        <button type="button" class="btn btn-primary">kiwi</button>
    </div></div>

    <div class="container">
        <h2>Button Groups Side by Side</h2>        
        <div class="btn-group">
            <button type="button" class="btn btn-primary">apple</button>
            <button type="button" class="btn btn-primary">banana</button>
            <button type="button" class="btn btn-primary">kiwi</button>
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-primary">apple</button>
            <button type="button" class="btn btn-primary">banana</button>
            <button type="button" class="btn btn-primary">kiwi</button>
        </div>
    </div>
    <div class="container">
        <h2>Nesting Button Groups & Dropdown Menus</h2>
        <div class="btn-group">
            <button type="button" class="btn btn-primary">apple</button>
            <button type="button" class="btn btn-primary">banana</button>
            <div class="btn-group">
            <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">kiwi</button>
             <div class="dropdown-menu">
                <a class="dropdown-item" href="#">bad kiwi</a>
                <a class="dropdown-item" href="#">good kiwi</a>
             </div>
        </div></div></div>
</body>
</html>
