<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</head>
<body>
    <h1>Bootstrap 5 Grids</h1>
    <h2>Three Equal Columns</h2>
    <div class="container-fluid">
    <div class="row bg-primary">
      <div class="col bg-dark text-white p-3">first</div>
      <!-- only write col not a responsive  -->
      <div class="col bg-primary text-white p-3">second</div>
      <div class="col bg-dark text-white p-3">third</div>
    </div></div>
    <h1>Responsive Columns</h1>
    <div class="container-fluid">
        <div class="row bg-primary">
          <div class="col-sm-3 bg-dark text-white p-3">first</div>
          <!-- col-sm-3 it is called responsive  -->
          <div class="col-sm-3 bg-primary text-white p-3">second</div>
          <div class="col-sm-3 bg-dark text-white p-3">third</div>
          <div class="col-sm-3 bg-primary text-white p-3">third</div>
        </div></div>
        <h1>Two Unequal Responsive Columns</h1>
        <div class="container-fluid">
            <div class="row bg-primary">
              <div class="col-sm-4 bg-dark text-white p-3">first</div>
              <!-- col-sm-3 it is called responsive  -->
              <div class="col-sm-8 bg-primary text-white p-3">second</div>
            </div></div>
</body>
</html>
